name: Screenshots

# Renders every widget style and the main screens to PNG (Robolectric, native graphics) so changes can be
# reviewed without a phone. Runs on branches other than main; download the "shots-<sha>" artifact.
on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - "**.md"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Render screenshots
        run: gradle :app:testDebugUnitTest --tests 'dev.savar.hiatus.Screenshots' --stacktrace

      # Artifacts aren't reachable from every review environment, git is: publish the PNGs as a single-commit
      # orphan branch "shots" (force-pushed, so history doesn't pile up).
      - name: Publish to shots branch
        if: always()
        run: |
          mkdir -p /tmp/shots && cp app/build/shots/*.png /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots
          echo "${{ github.sha }}" > SHA
          git init -q -b shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" shots
